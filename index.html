<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Roguelike HTML5 con IA</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        canvas {
            background-color: #000;
            border: 2px solid #555;
            border-radius: 8px;
            max-width: 100%;
            max-height: 60vh;
        }
        #ui-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
            max-width: 640px;
        }
        #info {
            font-size: 1.2em;
            width: 100%;
            text-align: center;
        }
        #descriptionBox {
            background-color: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 15px;
            min-height: 60px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            color: #b0e0e6; /* Un color azul pálido para el texto de la IA */
            font-style: italic;
        }
        .gemini-button {
            background: linear-gradient(45deg, #4f46e5, #c026d3);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .gemini-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .gemini-button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .controls {
            margin-top: 10px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Roguelike con IA</h1>
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <div id="ui-container">
        <div id="info">Nivel: 1 | Tesoro: 0</div>
        <div id="descriptionBox">Mueve a tu personaje y haz clic en el botón para obtener una descripción de tu entorno.</div>
        <button id="geminiBtn" class="gemini-button">✨ Describir la sala</button>
    </div>
    <div class="controls">Usa las teclas de flecha para moverte.</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const infoDiv = document.getElementById('info');
        const descriptionBox = document.getElementById('descriptionBox');
        const geminiBtn = document.getElementById('geminiBtn');

        const TILE_SIZE = 32;
        const MAP_WIDTH = canvas.width / TILE_SIZE;
        const MAP_HEIGHT = canvas.height / TILE_SIZE;

        // --- Estado del Juego ---
        let player = { x: 1, y: 1 };
        let treasures = [];
        let exit = { x: 0, y: 0 };
        let map = [];
        let score = 0;
        let level = 1;

        // --- Generación del Mapa ---
        function generateLevel() {
            // 1. Llenar todo de muros
            map = Array(MAP_WIDTH).fill(0).map(() => Array(MAP_HEIGHT).fill(1)); // 1 = Muro

            let x = Math.floor(MAP_WIDTH / 2);
            let y = Math.floor(MAP_HEIGHT / 2);
            const totalTiles = MAP_WIDTH * MAP_HEIGHT;
            const floorTilesToCreate = totalTiles / 2.5;
            let floorsCreated = 0;

            // 2. "Cavar" túneles aleatoriamente
            while (floorsCreated < floorTilesToCreate) {
                if (map[x][y] === 1) {
                    map[x][y] = 0; // 0 = Suelo
                    floorsCreated++;
                }
                const direction = Math.floor(Math.random() * 4);
                switch (direction) {
                    case 0: if (x > 1) x--; break;
                    case 1: if (x < MAP_WIDTH - 2) x++; break;
                    case 2: if (y > 1) y--; break;
                    case 3: if (y < MAP_HEIGHT - 2) y++; break;
                }
            }

            const placeObject = (objectType) => {
                let placed = false;
                while (!placed) {
                    let posX = Math.floor(Math.random() * MAP_WIDTH);
                    let posY = Math.floor(Math.random() * MAP_HEIGHT);
                    if (map[posX][posY] === 0) {
                        if (objectType === 'player') {
                           player = { x: posX, y: posY };
                        } else if (objectType === 'exit') {
                           exit = { x: posX, y: posY };
                        } else if (objectType === 'treasure') {
                           treasures.push({ x: posX, y: posY });
                        }
                        placed = true;
                    }
                }
            };
            
            placeObject('player');
            placeObject('exit');
            treasures = [];
            for (let i = 0; i < 5; i++) {
                placeObject('treasure');
            }
        }

        // --- Dibujado ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let x = 0; x < MAP_WIDTH; x++) {
                for (let y = 0; y < MAP_HEIGHT; y++) {
                    ctx.fillStyle = map[x][y] === 1 ? '#454545' : '#2a2a2a';
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
            
            // Dibujar salida
            ctx.fillStyle = '#8e44ad';
            ctx.fillRect(exit.x * TILE_SIZE, exit.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);

            // Dibujar tesoros
            ctx.fillStyle = '#f1c40f';
            treasures.forEach(t => {
                ctx.beginPath();
                ctx.arc(t.x * TILE_SIZE + TILE_SIZE / 2, t.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 4, 0, 2 * Math.PI);
                ctx.fill();
            });

            // Dibujar jugador
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.arc(player.x * TILE_SIZE + TILE_SIZE / 2, player.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 2 - 4, 0, 2 * Math.PI);
            ctx.fill();

            // Actualizar info
            infoDiv.textContent = `Nivel: ${level} | Tesoro: ${score}`;
        }

        // --- Controles y Lógica del Juego ---
        function handleInput(e) {
            let newX = player.x;
            let newY = player.y;

            switch (e.key) {
                case 'ArrowUp': newY--; break;
                case 'ArrowDown': newY++; break;
                case 'ArrowLeft': newX--; break;
                case 'ArrowRight': newX++; break;
                default: return;
            }

            // Comprobar colisión con muros
            if (map[newX] && map[newX][newY] === 0) {
                player.x = newX;
                player.y = newY;
                
                // Comprobar si hay tesoro
                const treasureIndex = treasures.findIndex(t => t.x === player.x && t.y === player.y);
                if (treasureIndex > -1) {
                    score++;
                    treasures.splice(treasureIndex, 1);
                }

                // Comprobar si está en la salida
                if (player.x === exit.x && player.y === exit.y) {
                    level++;
                    generateLevel();
                }
                
                draw();
            }
        }

        // --- Integración con Gemini API ---
        async function generateDescription() {
            geminiBtn.disabled = true;
            descriptionBox.innerHTML = '<div class="loader"></div>';

            // Construir un prompt contextual
            let wallCount = 0;
            const neighbors = [[0, -1], [0, 1], [-1, 0], [1, 0]];
            neighbors.forEach(([dx, dy]) => {
                const nx = player.x + dx;
                const ny = player.y + dy;
                if (!map[nx] || map[nx][ny] === 1) {
                    wallCount++;
                }
            });

            let context = "en medio de una sala abierta.";
            if (wallCount === 1) context = "en una sala grande.";
            if (wallCount === 2) context = "en un pasillo.";
            if (wallCount === 3) context = "en un callejón sin salida.";
            
            const systemPrompt = "Eres un director de mazmorras de fantasía, narrando un juego roguelike. Sé breve (2-3 frases), atmosférico y misterioso. Describe lo que el jugador ve en la cueva oscura. No te repitas.";
            const userQuery = `El jugador está ${context} ¿Qué ve?`;

            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error(`Error de API: ${response.statusText}`);
                }

                const result = await response.json();
                const description = result.candidates[0]?.content?.parts[0]?.text;
                
                descriptionBox.textContent = description || "No se pudo obtener una descripción.";

            } catch (error) {
                console.error("Error al llamar a la API de Gemini:", error);
                descriptionBox.textContent = "El narrador ancestral guarda silencio por ahora...";
            } finally {
                geminiBtn.disabled = false;
            }
        }

        // --- Inicio ---
        window.addEventListener('keydown', handleInput);
        geminiBtn.addEventListener('click', generateDescription);
        
        generateLevel();
        draw();
    </script>
</body>
</html>
